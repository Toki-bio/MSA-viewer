# Runs every test suite (tests/run-all.js) on each push and pull request.
# The browser suites use the Google Chrome that GitHub's Ubuntu runners
# include (/usr/bin/google-chrome, found by tests/lib/browser.js).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces the run of the older one, except on main, where every commit is tested
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # the regression suite alone may take 2 h by its own limit (tests/run-all.js); 90 was shorter than that (audit T2)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/meta/cache-bust.test.js reads the history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run all suites
        run: npm test
